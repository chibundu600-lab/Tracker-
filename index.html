<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Track your shipment</title>
<style>
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#13242C; --muted:#5B6E77; --line:#D3DCE0;
  --route:#0E7C86; --route-soft:#CFE7E9; --signal:#E8590C; --ok:#2B8A3E; --danger:#C92A2A;
  --on-route:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1A20; --surface:#16262E; --ink:#E8F0F3; --muted:#93A8B1; --line:#2A3F49;
    --route:#3CC1CC; --route-soft:#1B3B42; --signal:#FF8A4C; --ok:#69DB7C; --danger:#FF8787;
    --on-route:#0E1A20;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,"Noto Sans",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px}
.brand{font-weight:700;font-size:18px;letter-spacing:.01em}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;padding:4px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0 0 8px;font-weight:700}
h2{font-size:18px;margin:0 0 12px}
p.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--route);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{font:inherit;font-weight:600;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;background:var(--route);color:var(--on-route)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.track-form{display:flex;gap:10px}
.track-form input{flex:1}
.msg{margin:12px 0 0;font-size:14px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}

/* Route (kept left-to-right in every language so the truck moves origin to destination) */
.status-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status-big{font-size:26px;font-weight:700}
.badge{font-size:13px;color:var(--muted)}
.route{position:relative;margin:34px 6px 8px;height:44px;direction:ltr}
.route .track{position:absolute;left:0;right:0;top:20px;height:4px;background:var(--route-soft);border-radius:2px}
.route .done{position:absolute;left:0;top:20px;height:4px;background:var(--route);border-radius:2px;transition:width .8s ease}
.route .stop{position:absolute;top:14px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--route)}
.route .stop.a{left:-6px}.route .stop.b{right:-6px}
.route .stop.b.reached{background:var(--route)}
.route .truck{position:absolute;top:0;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--signal);display:grid;place-items:center;transition:left .8s ease;box-shadow:0 0 0 4px var(--surface)}
.route .truck svg{width:24px;height:24px;fill:#fff}
.ends{display:flex;justify-content:space-between;font-size:14px;gap:12px;direction:ltr}
.ends div:first-child{text-align:left}
.ends div:last-child{text-align:right}
.ends small{display:block;color:var(--muted);font-size:12px}
.meta{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.meta small{display:block;color:var(--muted);font-size:12px}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 20px 0;padding-inline-start:26px;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.tl li:last-child{border-inline-start-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;inset-inline-start:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl li:first-child::before{background:var(--route);box-shadow:0 0 0 4px var(--route-soft)}
.tl .t-status{font-weight:600}
.tl .t-meta{font-size:13px;color:var(--muted)}
.tl .t-note{font-size:14px;margin-top:2px}
.tl .x{float:inline-end}

/* Admin list */
.ship-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ship-item:last-child{border-bottom:0}
.ship-item strong{display:block}
.ship-item span{font-size:13px;color:var(--muted)}
input[type=range]{padding:0;accent-color:var(--route)}
@media (prefers-reduced-motion: reduce){.route .done,.route .truck{transition:none}}
</style>
</head>

document.documentElement.lang = LANG;
document.documentElement.dir = (LANG === "ar") ? "rtl" : "ltr";
const DATE_LOCALE = (navigator.languages && navigator.languages[0]) || LANG;

/* ====== APP ====== */
const STATUSES = [
  {name:EN_STATUSES[0], pct:5},
  {name:EN_STATUSES[1], pct:25},
  {name:EN_STATUSES[2], pct:55},
  {name:EN_STATUSES[3], pct:85},
  {name:EN_STATUSES[4], pct:100}
];
const KEY = "shipments";
let db = {shipments:[]};
let mode = "client";
let authed = false;
let selectedId = null;
let viewing = null;
let pendingDelete = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => { try{ return new Date(iso).toLocaleString(DATE_LOCALE, {dateStyle:"medium", timeStyle:"short"}); }catch(e){ return new Date(iso).toLocaleString(); } };

/* Storage: Firebase Firestore (one document per shipment, id = tracking number in lowercase) */
const configured = !firebaseConfig.apiKey.startsWith("PASTE");
let fdb = null, auth = null;
if(configured){
  const app = initializeApp(firebaseConfig);
  fdb = getFirestore(app);
  auth = getAuth(app);
}
const keyOf = id => String(id).trim().toLowerCase();
async function fetchOne(id){
  const snap = await getDoc(doc(fdb, "shipments", keyOf(id)));
  db.shipments = snap.exists() ? [snap.data()] : [];
}
async function fetchAll(){
  const snap = await getDocs(collection(fdb, "shipments"));
  db.shipments = snap.docs.map(d => d.data()).sort((a,b) => (b.created||0) - (a.created||0));
}
async function saveShip(s){
  try{ await setDoc(doc(fdb, "shipments", keyOf(s.id)), s); return true; }
  catch(e){ console.error(e); return false; }
}
async function removeShip(s){
  try{ await deleteDoc(doc(fdb, "shipments", keyOf(s.id))); return true; }
  catch(e){ console.error(e); return false; }
}
const notice = () => configured ? "" :
  `<p class="msg err" style="margin:0 0 16px">Setup needed: paste your Firebase details into the settings at the top of this file.</p>`;
const find = id => db.shipments.find(s => s.id.toLowerCase() === String(id).trim().toLowerCase());

const truckSvg = '<svg viewBox="0 0 24 24"><path d="M3 6h11v9H3zM14 9h4l3 3v3h-7zM6.5 19a2 2 0 100-4 2 2 0 000 4zm11 0a2 2 0 100-4 2 2 0 000 4z"/></svg>';

function routeHTML(s){
  const p = Math.max(0, Math.min(100, s.progress));
  return `
  <div class="route" role="img" aria-label="${esc(t("routeAria",{p}))}">
    <div class="track"></div>
    <div class="done" style="width:${p}%"></div>
    <div class="stop a"></div>
    <div class="stop b ${p>=100?"reached":""}"></div>
    <div class="truck" style="left:${p}%">${truckSvg}</div>
  </div>
  <div class="ends">
    <div><small>${esc(t("from"))}</small>${esc(s.origin)}</div>
    <div><small>${esc(t("to"))}</small>${esc(s.dest)}</div>
  </div>`;
}
function timelineHTML(s, admin){
  if(!s.updates.length) return `<p class="sub">${esc(t("noUpdates"))}</p>`;
  return '<ul class="tl">' + s.updates.map((u,i)=>`
    <li>
      ${admin?`<button class="link x" data-del="${i}">${esc(t("remove"))}</button>`:""}
      <div class="t-status">${esc(tStatus(u.status))}</div>
      <div class="t-meta">${esc(fmt(u.t))}${u.loc?" · "+esc(u.loc):""}</div>
      ${u.note?`<div class="t-note">${esc(u.note)}</div>`:""}
    </li>`).join("") + '</ul>';
}
function summaryHTML(s){
  return `
  <div class="panel">
    <div class="status-line">
      <div class="status-big">${esc(tStatus(s.status))}</div>
      <div class="badge">${esc(t("trackNo"))} ${esc(s.id)}</div>
    </div>
    ${routeHTML(s)}
    <div class="meta">
      ${s.client?`<div><small>${esc(t("preparedFor"))}</small>${esc(s.client)}</div>`:""}
      ${s.eta?`<div><small>${esc(t("expected"))}</small>${esc(s.eta)}</div>`:""}
      <div><small>${esc(t("lastUpdated"))}</small>${s.updates[0]?esc(fmt(s.updates[0].t)):"—"}</div>
    </div>
  </div>`;
}

/* ===== Client view ===== */
function renderClient(){
  const s = viewing ? find(viewing) : null;
  $("#app").innerHTML = `
    <h1>${esc(t("h_client"))}</h1>
    <p class="sub">${esc(t("sub_client"))}</p>
    ${notice()}
    <form class="track-form" id="trackForm" onsubmit="return false">
      <input id="tn" placeholder="${esc(t("tn_ph"))}" autocomplete="off" value="${esc(viewing||"")}" aria-label="${esc(t("trackNum"))}">
      <button class="btn" id="trackBtn" type="button">${esc(t("track"))}</button>
    </form>
    <p class="msg err" id="clientMsg"></p>
    <div id="result" style="margin-top:20px">
      ${s ? summaryHTML(s) + `<div class="panel"><h2>${esc(t("updates"))}</h2>${timelineHTML(s,false)}</div>` : ""}
    </div>`;
  const go = async () => {
    const v = $("#tn").value.trim();
    if(!v) return;
    $("#trackBtn").textContent = t("checking");
    try{
      if(!configured) throw new Error("not configured");
      await fetchOne(v);
    }catch(e){
      console.error(e);
      viewing = null; renderClient(); $("#tn").value = v;
      $("#clientMsg").textContent = t("errLoad"); return;
    }
    if(find(v)){ viewing = find(v).id; renderClient(); }
    else { viewing = null; renderClient(); $("#tn").value = v; $("#clientMsg").textContent = t("notFound"); }
  };
  $("#trackBtn").onclick = go;
  $("#tn").onkeydown = e => { if(e.key==="Enter") go(); };
}

/* ===== Admin ===== */
function renderLogin(){
  $("#app").innerHTML = `
    <h1>${esc(t("h_login"))}</h1>
    <p class="sub">${esc(t("sub_login"))}</p>
    <div class="panel">
      <label for="pc">${esc(t("passcode"))}</label>
      <input id="pc" type="password" autocomplete="off">
      <p class="msg err" id="loginMsg"></p>
      <button class="btn" id="loginBtn" style="margin-top:12px">${esc(t("signin"))}</button>
    </div>`;
  const go = async () => {
    try{
      if(!configured) throw new Error("not configured");
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $("#pc").value);
    }catch(e){
      console.error(e);
      $("#loginMsg").textContent = t("wrong"); return;
    }
    authed = true;
    try{ await fetchAll(); }catch(e){ console.error(e); }
    renderAdmin();
  };
  $("#loginBtn").onclick = go;
  $("#pc").onkeydown = e => { if(e.key==="Enter") go(); };
}

function renderAdmin(){
  const s = selectedId ? find(selectedId) : null;
  $("#app").innerHTML = `
    <h1>${esc(t("h_manage"))}</h1>
    <p class="sub">${esc(t("sub_manage"))}</p>
    ${notice()}

    <div class="panel">
      <h2>${esc(t("yourShips"))}</h2>
      ${db.shipments.length ? db.shipments.map(x=>`
        <div class="ship-item" data-open="${esc(x.id)}">
          <div><strong>${esc(x.id)}</strong><span>${esc(x.client||t("noClient"))} · ${esc(x.origin)} → ${esc(x.dest)}</span></div>
          <span>${esc(tStatus(x.status))}</span>
        </div>`).join("") : `<p class="sub" style="margin:0">${esc(t("noShips"))}</p>`}
    </div>

    ${s ? editorHTML(s) : ""}

    <div class="panel">
      <h2>${esc(t("newShip"))}</h2>
      <div class="row">
        <div><label for="n_id">${esc(t("trackNum"))}</label><input id="n_id" placeholder="TRK-1001"></div>
        <div><label for="n_client">${esc(t("clientName"))}</label><input id="n_client"></div>
      </div>
      <div class="row">
        <div><label for="n_o">${esc(t("from"))}</label><input id="n_o" placeholder="${esc(t("cityPh"))}"></div>
        <div><label for="n_d">${esc(t("to"))}</label><input id="n_d" placeholder="${esc(t("cityPh"))}"></div>
      </div>
      <label for="n_eta">${esc(t("expected"))}</label>
      <input id="n_eta" placeholder="${esc(t("etaPh"))}">
      <p class="msg" id="newMsg"></p>
      <button class="btn" id="createBtn" style="margin-top:12px">${esc(t("create"))}</button>
    </div>`;

  document.querySelectorAll("[data-open]").forEach(el => el.onclick = () => { selectedId = el.dataset.open; pendingDelete = null; renderAdmin(); window.scrollTo(0,0); });
  $("#createBtn").onclick = createShipment;
  if(s) wireEditor(s);
}

function editorHTML(s){
  return `
  <div class="panel">
    <h2>${esc(s.id)}</h2>
    ${routeHTML(s)}
    <label for="e_status">${esc(t("statusLbl"))}</label>
    <select id="e_status">${STATUSES.map(x=>`<option value="${esc(x.name)}" ${x.name===s.status?"selected":""}>${esc(tStatus(x.name))}</option>`).join("")}</select>
    <label for="e_prog">${esc(t("progress"))}: <span id="e_pv">${s.progress}</span>%</label>
    <input id="e_prog" type="range" min="0" max="100" value="${s.progress}">
    <div class="row">
      <div><label for="e_loc">${esc(t("curLoc"))}</label><input id="e_loc" placeholder="${esc(t("locPh"))}"></div>
      <div><label for="e_eta">${esc(t("expected"))}</label><input id="e_eta" value="${esc(s.eta)}"></div>
    </div>
    <label for="e_note">${esc(t("note"))}</label>
    <textarea id="e_note"></textarea>
    <p class="msg" id="editMsg"></p>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn" id="postBtn">${esc(t("post"))}</button>
      <button class="btn ghost" id="closeBtn">${esc(t("close"))}</button>
      <button class="btn danger" id="delShip" style="margin-inline-start:auto">${esc(pendingDelete===s.id?t("delConfirm"):t("del"))}</button>
    </div>
  </div>
  <div class="panel"><h2>${esc(t("history"))}</h2>${timelineHTML(s,true)}</div>`;
}

function wireEditor(s){
  $("#e_status").onchange = e => {
    const st = STATUSES.find(x=>x.name===e.target.value);
    $("#e_prog").value = st.pct; $("#e_pv").textContent = st.pct;
  };
  $("#e_prog").oninput = e => $("#e_pv").textContent = e.target.value;
  $("#closeBtn").onclick = () => { selectedId = null; renderAdmin(); };
  $("#postBtn").onclick = async () => {
    s.status = $("#e_status").value;
    s.progress = Number($("#e_prog").value);
    s.eta = $("#e_eta").value.trim();
    s.updates.unshift({t:new Date().toISOString(), status:s.status, loc:$("#e_loc").value.trim(), note:$("#e_note").value.trim()});
    const ok = await saveShip(s);
    renderAdmin();
    $("#editMsg").className = "msg " + (ok?"ok":"err");
    $("#editMsg").textContent = ok ? t("posted") : t("errSave");
  };
  $("#delShip").onclick = async () => {
    if(pendingDelete !== s.id){ pendingDelete = s.id; renderAdmin(); return; }
    const gone = await removeShip(s);
    if(gone) db.shipments = db.shipments.filter(x=>x!==s);
    selectedId = null; pendingDelete = null;
    renderAdmin();
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    s.updates.splice(Number(b.dataset.del),1);
    if(s.updates[0]) s.status = s.updates[0].status;
    await saveShip(s); renderAdmin();
  });
}

async function createShipment(){
  const id = $("#n_id").value.trim(), o = $("#n_o").value.trim(), d = $("#n_d").value.trim();
  const m = $("#newMsg"); m.className = "msg err";
  if(!id || !o || !d){ m.textContent = t("errFields"); return; }
  if(find(id)){ m.textContent = t("errExists"); return; }
  const ship = {
    created:Date.now(),
    id, client:$("#n_client").value.trim(), origin:o, dest:d, eta:$("#n_eta").value.trim(),
    status:STATUSES[0].name, progress:STATUSES[0].pct,
    updates:[{t:new Date().toISOString(), status:STATUSES[0].name, loc:o, note:""}]
  };
  const ok = await saveShip(ship);
  if(!ok){ m.textContent = t("errSave"); return; }
  db.shipments.unshift(ship);
  selectedId = id; renderAdmin();
}

/* ===== Mode switch ===== */
$("#modeBtn").onclick = async () => {
  if(mode==="client"){
    mode="admin"; $("#modeBtn").textContent = t("viewClient");
    if(configured){ try{ await auth.authStateReady(); authed = !!auth.currentUser; }catch(e){ authed = false; } }
    if(authed){ try{ await fetchAll(); }catch(e){ console.error(e); } renderAdmin(); } else renderLogin();
  } else {
    mode="client"; $("#modeBtn").textContent = t("admin");
    if(viewing && configured){ try{ await fetchOne(viewing); }catch(e){} }
    renderClient();
  }
};

document.title = BUSINESS_NAME;
$("#brand").textContent = BUSINESS_NAME;
$("#modeBtn").textContent = t("admin");
renderClient();
</script>
</body>
</html>
